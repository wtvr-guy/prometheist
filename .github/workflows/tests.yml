name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jit_agent_app
          POSTGRES_PASSWORD: jit_agent_test_pw
          POSTGRES_DB: jit_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jit_agent_app -d jit_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://jit_agent_app:jit_agent_test_pw@localhost:5432/jit_agent_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Run test suite
        run: uv run pytest -q
