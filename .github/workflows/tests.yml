name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jit_agent_app
          POSTGRES_PASSWORD: jit_agent_test_pw
          POSTGRES_DB: jit_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jit_agent_app -d jit_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://jit_agent_app:jit_agent_test_pw@localhost:5432/jit_agent_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.12.5

      - name: Sync locked environment
        run: uv sync --locked

      - name: Verify local-model acceptance tests are collected
        run: >-
          uv run --locked pytest --collect-only -q -m ollama
          tests/test_acceptance_restart.py
          tests/test_cross_conversation_memory.py
          tests/test_acceptance_conversation_continuity.py

      - name: Run deterministic test suite
        run: uv run --locked pytest -q -m "not ollama"

  windows-cli-encoding:
    name: Windows CLI encoding contract
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.12.5

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run CLI encoding contract without database fixtures
        run: uv run --locked pytest --noconftest -q tests/test_cli.py tests/test_cli_helpers.py
