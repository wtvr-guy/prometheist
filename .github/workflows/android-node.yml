name: Android node
on:
  push:
    branches: [main, feat/android-private-node]
    paths: ['android/**', 'installers/android/**', 'scripts/*phone_node*', 'src/prometheist/node_*.py', 'tests/unit/test_node_*.py', '.github/workflows/android-node.yml']
  pull_request:
    paths: ['android/**', 'installers/android/**', 'scripts/*phone_node*', 'src/prometheist/node_*.py', 'tests/unit/test_node_*.py', '.github/workflows/android-node.yml']
permissions:
  contents: read
concurrency:
  group: android-node-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-scripts:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Parse Windows setup and installer scripts
        shell: powershell
        run: |
          foreach ($path in @('scripts/install_phone_node.ps1', 'scripts/setup_phone_node.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify bundled APK and source provenance
        run: python scripts/package_phone_node.py --verify
      - name: Build, unit tests and lint
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Enable KVM for disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Keystore and offline-store native contracts
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Retain synthetic validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-node-validation
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
