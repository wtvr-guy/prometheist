[project]
name = "jit-agent"
# Internal package/release metadata is intentionally independent of Prometheist's
# architectural milestone labels (v0.5, v0.6, ...). See README.md#versioning.
version = "0.4.0"
description = "Local-first stateless multi-agent prototype with shared JIT memory"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
jit-agent = "jit_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
